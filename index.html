<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>赵钰 · 生日快乐 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",sans-serif;
    background:#fff8ee; color:#3d2c29; min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(#f3e3c8 1.2px, transparent 1.2px);
    background-size:22px 22px;
  }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:50; }
  .wrap { max-width:560px; margin:0 auto; padding:30px 18px 46px; position:relative; z-index:2; }
  .balloons { text-align:center; font-size:40px; letter-spacing:10px; animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  h1 { text-align:center; font-size:40px; letter-spacing:3px; margin-top:8px; }
  h1 .name { color:#e8524a; }
  .date { text-align:center; color:#a08b7d; font-size:15px; margin-top:8px; letter-spacing:2px; }
  .chip {
    width:fit-content; margin:16px auto 0; background:#fff; border:2.5px solid #3d2c29;
    border-radius:999px; padding:7px 18px; font-size:15px; font-weight:bold; box-shadow:3px 3px 0 #3d2c29;
  }
  .card {
    background:#fff; border:2.5px solid #3d2c29; border-radius:20px;
    box-shadow:4px 4px 0 #3d2c29; padding:22px 18px; margin-top:24px; text-align:center;
  }
  .card h2 { font-size:19px; margin-bottom:6px; }
  .card .hint { color:#a08b7d; font-size:13px; }
  /* cake */
  .cake { position:relative; width:230px; margin:26px auto 6px; }
  .candles { display:flex; justify-content:space-evenly; padding:0 26px; }
  .candle { position:relative; width:12px; height:44px; background:repeating-linear-gradient(45deg,#ffd166 0 6px,#fff 6px 12px); border:2px solid #3d2c29; border-radius:4px; }
  .flame {
    position:absolute; left:50%; top:-20px; width:14px; height:19px; margin-left:-7px;
    background:radial-gradient(circle at 50% 75%, #fff6c9 0 22%, #ffb703 55%, #fb8500 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    transform-origin:50% 100%; animation:flick .28s ease-in-out infinite alternate;
    cursor:pointer;
  }
  @keyframes flick { from{ transform:scale(1) rotate(-2.5deg);} to{ transform:scale(1.1,1.18) rotate(2.5deg);} }
  .flame.out { display:none; }
  .smoke { position:absolute; left:50%; top:-24px; margin-left:-3px; font-size:13px; opacity:0; }
  .smoke.go { animation:smokeUp 1.1s ease-out forwards; }
  @keyframes smokeUp { 0%{opacity:.75; transform:translateY(0);} 100%{opacity:0; transform:translateY(-26px);} }
  .layer { border:2.5px solid #3d2c29; margin:0 auto; position:relative; }
  .layer.top  { width:130px; height:40px; background:#ffd9d2; border-radius:10px 10px 4px 4px; }
  .layer.mid  { width:180px; height:46px; background:#ffe9a8; border-radius:10px 10px 4px 4px; margin-top:-2px; }
  .layer.base { width:230px; height:52px; background:#cde7ff; border-radius:10px 10px 6px 6px; margin-top:-2px; }
  .layer::before { content:""; position:absolute; top:6px; left:10px; right:10px; border-top:3px dotted rgba(61,44,41,.28); }
  .plate { width:262px; height:12px; background:#3d2c29; border-radius:999px; margin:6px auto 0; }
  .btn {
    display:inline-block; margin-top:18px; font-family:inherit; font-size:17px; font-weight:bold;
    color:#3d2c29; background:#ffd166; border:2.5px solid #3d2c29; border-radius:999px;
    padding:11px 26px; cursor:pointer; box-shadow:3px 3px 0 #3d2c29;
  }
  .btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #3d2c29; }
  .btn.ghost { background:#fff; font-size:15px; padding:9px 20px; }
  .btn:disabled { opacity:.45; }
  /* letter */
  #letter { display:none; text-align:left; }
  #letter.open { display:block; animation:fadeUp .7s ease both; }
  @keyframes fadeUp { from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  #letter .to { font-size:17px; font-weight:bold; margin-bottom:10px; }
  #letter p { font-size:15.5px; line-height:1.95; margin-bottom:10px; }
  #letter .sign { text-align:right; font-size:15px; margin-top:14px; color:#e8524a; font-weight:bold; }
  .wish { display:none; font-size:19px; font-weight:bold; color:#e8524a; margin-top:14px; }
  .wish.show { display:block; animation:fadeUp .7s ease both; }
  footer { text-align:center; color:#c4b096; font-size:12.5px; margin-top:28px; line-height:1.8; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="balloons">🎈🎈🎈</div>
  <h1><span class="name">赵钰</span>，生日快乐！</h1>
  <p class="date">10 月 25 日 · 星期日</p>
  <div class="chip" id="countdown">🎂</div>

  <div class="card">
    <h2>先许个愿吧 🕯️</h2>
    <p class="hint">点一点蜡烛，或者按下面的按钮，把它们都吹灭</p>
    <div class="cake">
      <div class="candles" id="candles"></div>
      <div class="layer top"></div>
      <div class="layer mid"></div>
      <div class="layer base"></div>
      <div class="plate"></div>
    </div>
    <p class="wish" id="wish">✨ 愿望收好了，新的一岁，它会慢慢实现 ✨</p>
    <button class="btn" id="blowBtn">吹灭蜡烛 💨</button>
    <br>
    <button class="btn ghost" id="musicBtn">🎵 播放生日快乐歌</button>
  </div>

  <div class="card" id="letter">
    <p class="to">赵钰：</p>
    <p>生日快乐！</p>
    <p>新的一岁，愿你工作顺顺利利，生活开开心心；想做的事慢慢都实现，想去的地方一个个去打卡。身体健康，笑口常开，好运常伴。</p>
    <p class="sign">—— Ralph</p>
  </div>

  
  <footer>🎂 2026 年 10 月 25 日 · 生日快乐</footer>
</div>

<script>
// ---------- countdown ----------
(function(){
  const el = document.getElementById('countdown');
  const now = new Date();
  const thisYear = new Date(now.getFullYear(), 9, 25); // Oct 25
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dayMs = 86400000;
  let diff = Math.round((thisYear - startToday) / dayMs);
  if (diff > 0) el.textContent = '🎂 距离你的生日还有 ' + diff + ' 天';
  else if (diff === 0) el.textContent = '🎉 今天就是你的生日，生日快乐！';
  else el.textContent = '🎂 这是属于你的日子 · ' + now.getFullYear() + ' 年 10 月 25 日';
})();

// ---------- candles ----------
const candlesEl = document.getElementById('candles');
let flames = [];
for (let i = 0; i < 5; i++) {
  const c = document.createElement('div'); c.className = 'candle';
  const f = document.createElement('div'); f.className = 'flame';
  const s = document.createElement('div'); s.className = 'smoke'; s.textContent = '💨';
  f.addEventListener('click', () => blowOne(i));
  c.appendChild(f); c.appendChild(s); candlesEl.appendChild(c);
  flames.push({ f, s, out: false });
}
function blowOne(i) {
  const fl = flames[i];
  if (fl.out) return;
  fl.out = true; fl.f.classList.add('out');
  fl.s.classList.remove('go'); void fl.s.offsetWidth; fl.s.classList.add('go');
  if (flames.every(x => x.out)) celebrate();
}
let celebrated = false;
function celebrate() {
  if (celebrated) return; celebrated = true;
  document.getElementById('wish').classList.add('show');
  document.getElementById('letter').classList.add('open');
  document.getElementById('blowBtn').disabled = true;
  burst(160);
  setTimeout(() => burst(90), 350);
}
document.getElementById('blowBtn').addEventListener('click', () => {
  flames.forEach((_, i) => setTimeout(() => blowOne(i), i * 130));
});

// ---------- confetti ----------
const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCanvas(){ cv.width = innerWidth; cv.height = innerHeight; }
sizeCanvas(); addEventListener('resize', sizeCanvas);
const COLORS = ['#e8524a','#ffd166','#f5b942','#7ac74f','#4dabf7','#e599f7'];
function burst(n) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .5,
      y: innerHeight * .32,
      vx: (Math.random() - .5) * 11, vy: -(4 + Math.random() * 8),
      w: 5 + Math.random() * 6, h: 8 + Math.random() * 7,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      color: COLORS[i % COLORS.length], life: 1
    });
  }
  if (!raf) tick();
}
function tick() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 30);
  for (const p of parts) {
    p.vy += .28; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.rot += p.vr; p.life -= .004;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, cv.width, cv.height), null);
}
// gentle welcome sprinkle
setTimeout(() => burst(60), 500);

// ---------- happy birthday (piano recording) ----------
const hbAudio = new Audio('happy-birthday.mp3');
hbAudio.preload = 'auto';
const musicBtn = document.getElementById('musicBtn');
function songEnded(){ musicBtn.textContent = '🎵 播放生日快乐歌'; }
hbAudio.addEventListener('ended', songEnded);
musicBtn.addEventListener('click', () => {
  if (hbAudio.paused) {
    hbAudio.play();
    musicBtn.textContent = '⏸️ 停一下';
  } else {
    hbAudio.pause();
    songEnded();
  }
});
</script>
</body>
</html>
